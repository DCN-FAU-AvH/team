<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var frameId = params.get("frameId");

  function sendHeight() {
    var wrapper = document.getElementById("dcn-content-wrapper");
    // Measure the exact height of the content wrapper + body margins
    var height = wrapper 
      ? Math.ceil(wrapper.getBoundingClientRect().height) 
      : Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);

    if (height > 0) {
      window.parent.postMessage({ 
        type: "dcn-resize", 
        frameId: frameId, 
        height: height 
      }, "*");
    }
  }

  // Fire at every stage of rendering so nothing gets cropped
  window.addEventListener("DOMContentLoaded", sendHeight);
  window.addEventListener("load", sendHeight);
  window.addEventListener("resize", sendHeight);
  
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(sendHeight);
  }

  // Fallback timers for slow network/font rendering
  setTimeout(sendHeight, 150);
  setTimeout(sendHeight, 600);

  if (typeof ResizeObserver !== "undefined") {
    var target = document.getElementById("dcn-content-wrapper") || document.body;
    new ResizeObserver(sendHeight).observe(target);
  }
})();
</script>
